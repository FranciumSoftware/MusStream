name: Build and Package

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: deb
          - os: macos-latest
            target: x86_64-apple-darwin
            package: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            package: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: msi

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Ensure pkg-config and the fontconfig development files are available for build scripts
        sudo apt-get install -y \
          pkg-config \
          libfontconfig1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libgtk-3-dev
        # Print where pkg-config searches and verify fontconfig is found (helps debugging CI failures)
        echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
        pkg-config --cflags --libs fontconfig || {
          echo "fontconfig NOT found via pkg-config; listing pkgconfig directories:";
          ls -la /usr/lib/x86_64-linux-gnu/pkgconfig || true;
          ls -la /usr/lib/pkgconfig || true;
          echo "Setting PKG_CONFIG_PATH to include common locations and retrying";
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:$PKG_CONFIG_PATH;
          pkg-config --cflags --libs fontconfig || { echo "fontconfig still not found"; exit 1; }
        }

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      run: |
        # Use Homebrew on macOS to provide fontconfig and pkg-config for build scripts
        brew update || true
        brew install pkg-config fontconfig || true

    - name: Verify pkg-config fontconfig (debug)
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Verifying fontconfig via pkg-config"
        pkg-config --modversion fontconfig

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install -y dpkg
        cargo install cargo-deb
        cargo deb --target ${{ matrix.target }}

    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cargo install cargo-bundle
        cargo bundle --release --target ${{ matrix.target }}

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cargo install cargo-wix
        cargo wix --no-build

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./target/${{ matrix.target }}/release/*.${{ matrix.package }}
        asset_name: ${{ github.event.repository.name }}-${{ github.event.release.tag_name }}-${{ matrix.target }}.${{ matrix.package }}
        asset_content_type: application/octet-stream
