Direct answer: The failure is caused by the missing system library fontconfig (and/or pkg-config) on the CI runner so the yeslogic-fontconfig-sys build script fails when it calls pkg-config. I can't push the fix to your repository because I don't have permission, but below is a safe workflow fix you can apply (file contents + instructions). It installs pkg-config and the fontconfig development package on Ubuntu runners and installs pkg-config/fontconfig via Homebrew on macOS runners, and adds a short pkg-config verification step to make CI failures easier to debug.

Why this fixes it (short):

    The panic comes from build.rs using pkg-config to find fontconfig. On Ubuntu runners the package that provides fontconfig.pc is libfontconfig1-dev (and pkg-config must be present). Installing those packages ensures pkg-config can find fontconfig and prevents the build script from returning Err and unwrap()-panicking.

